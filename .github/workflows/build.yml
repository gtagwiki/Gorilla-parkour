name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gorilla-parkour
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: |
          ls *.zip | sort -V | while read z; do unzip -oq "$z"; done
      - name: Set version
        run: |
          V="V1.1.${{ github.run_number }}"
          sed -i "s|<div class=\"pid\" id=\"pid\">|<div class=\"pid\">$V</div><div class=\"pid\" id=\"pid\">|" index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run verify
      - run: npm run build
      - run: npx cap add android
      - name: Landscape and fullscreen
        run: |
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: gorilla-parkour/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gorilla-parkour-apk
          path: gorilla-parkour/android/app/build/outputs/apk/debug/app-debug.apk
